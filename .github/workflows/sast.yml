name: Reusable SAST

on:
  workflow_call:
    inputs:
      semgrep-config:
        description: 'Semgrep rule config path (vendored rules) or registry ref'
        required: false
        default: 'policy/semgrep-rules'
        type: string
      paths:
        description: 'Paths to scan (space-separated)'
        required: false
        default: '.'
        type: string
      gitleaks-config:
        description: 'Optional gitleaks config path (empty = built-in rules; .gitleaksignore at repo root is always honored)'
        required: false
        default: ''
        type: string
      trivy-scanners:
        description: 'Trivy fs scanners (comma-separated)'
        required: false
        default: 'vuln,misconfig'
        type: string
      dep-review-fail-on:
        description: 'Dependency Review fail-on-severity (low|moderate|high|critical)'
        required: false
        default: 'low'
        type: string
    outputs:
      semgrep-result:
        description: 'Semgrep job result'
        value: ${{ jobs.semgrep.result }}
      gitleaks-result:
        description: 'Gitleaks job result'
        value: ${{ jobs.gitleaks.result }}
      trivy-result:
        description: 'Trivy job result'
        value: ${{ jobs.trivy.result }}
      dep-review-result:
        description: 'Dependency Review job result'
        value: ${{ jobs.dependency-review.result }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep scan (digest-pinned container)
        run: |
          set -euo pipefail
          IMAGE='semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b'
          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$IMAGE" \
            semgrep scan --config "${{ inputs.semgrep-config }}" \
            --no-rewrite-rule-ids \
            --sarif --output /repo/semgrep.sarif ${{ inputs.paths }}
          test -s semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF artifact (for policy gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 1
          if-no-files-found: error

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan (dir + git, digest-pinned container)
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          docker pull "$IMAGE"
          CFG="${{ inputs.gitleaks-config }}"
          CFG_ARGS=()
          if [ -n "$CFG" ]; then
            test -f "$CFG" || { echo "::error::gitleaks config not found: $CFG"; exit 1; }
            CFG_ARGS=(--config "/repo/$CFG")
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$IMAGE" \
            dir . --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path /repo/gitleaks-dir.sarif \
            "${CFG_ARGS[@]}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$IMAGE" \
            git . --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path /repo/gitleaks-git.sarif \
            "${CFG_ARGS[@]}"
          test -s gitleaks-dir.sarif
          test -s gitleaks-git.sarif
          python3 - <<'PY'
          import json
          docs = []
          for name in ("gitleaks-dir.sarif", "gitleaks-git.sarif"):
              with open(name) as f:
                  docs.append(json.load(f))
          # Code scanning rejects multiple runs with the same tool in one
          # upload, so combine same-driver runs into a single run.
          merged = {"version": docs[0].get("version", "2.1.0"), "runs": []}
          by_driver = {}
          for doc in docs:
              for run in doc.get("runs", []):
                  drv = run.get("tool", {}).get("driver", {}).get("name")
                  if drv in by_driver:
                      by_driver[drv].setdefault("results", []).extend(
                          run.get("results", []))
                  else:
                      by_driver[drv] = run
                      merged["runs"].append(run)
          if not merged["runs"]:
              raise SystemExit("gitleaks SARIF merge produced no runs")
          with open("gitleaks.sarif", "w") as f:
              json.dump(merged, f)
          print(f"merged gitleaks SARIF: {len(merged['runs'])} runs, "
                f"{sum(len(r.get('results', [])) for r in merged['runs'])} results")
          PY

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload Gitleaks SARIF artifact (for policy gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy fs scan (digest-pinned container)
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa'
          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$IMAGE" \
            fs --scanners "${{ inputs.trivy-scanners }}" \
            --format sarif --output /repo/trivy.sarif \
            --exit-code 0 \
            --skip-check-update --skip-version-check \
            ${{ inputs.paths }}
          test -s trivy.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload Trivy SARIF artifact (for policy gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 1
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review (fail on new vulnerable dependencies)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dep-review-fail-on }}

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Lint workflow files
        run: |
          set -euo pipefail
          # Lints this run: blocks with the runner's shellcheck + pyflakes.
          # Never start a comment with the word shellcheck (actionlint feeds
          # blocks to shellcheck, which parses that as a directive).
          # -ignore: workflow_call output property jobs.<id>.result is valid
          # GitHub syntax actionlint's type model does not cover
          # (rhysd/actionlint#343), exact-message scoped so a typo still fails.
          "$RUNNER_TEMP/actionlint" \
            -shellcheck shellcheck \
            -pyflakes pyflakes \
            -ignore 'property "result" is not defined' \
            .github/workflows/*.yml

name: Reusable SAST

on:
  workflow_call:
    inputs:
      semgrep-config:
        description: 'Semgrep rule config path (vendored rules) or registry ref'
        required: false
        default: 'policy/semgrep-rules'
        type: string
      paths:
        description: 'Paths to scan (space-separated)'
        required: false
        default: '.'
        type: string
    outputs:
      semgrep-result:
        description: 'Semgrep job result'
        value: ${{ jobs.semgrep.result }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep scan (digest-pinned container)
        run: |
          set -euo pipefail
          IMAGE='semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b'
          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$IMAGE" \
            semgrep scan --config "${{ inputs.semgrep-config }}" \
            --no-rewrite-rule-ids \
            --sarif --output /repo/semgrep.sarif ${{ inputs.paths }}
          test -s semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF artifact (for policy gate)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 1
          if-no-files-found: error

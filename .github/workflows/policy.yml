name: Reusable Policy Gate

on:
  workflow_call:
    inputs:
      mode:
        description: 'Gate mode: warn | enforce-critical | enforce-full (main is clamped to enforce-full)'
        required: false
        default: 'enforce-critical'
        type: string
      policy-path:
        description: 'Directory containing Rego policies'
        required: false
        default: 'policy/'
        type: string
      sarif-artifacts:
        description: 'Comma-separated SARIF artifact names uploaded by the SAST workflow (all are required)'
        required: false
        default: 'semgrep-sarif,gitleaks-sarif,trivy-sarif'
        type: string
      baseline-file:
        description: 'Findings baseline path (empty string disables the baseline)'
        required: false
        default: 'policy/baseline.json'
        type: string
      conftest-version:
        description: 'conftest release version (must match conftest-sha256)'
        required: false
        default: '0.71.0'
        type: string
      conftest-sha256:
        description: 'Trusted SHA-256 of conftest Linux x86_64 tarball'
        required: false
        default: '765dfefdf0730693d7541ea0147e10d530a54ed257bbfec055ff34c837ffdf72'
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve effective gate mode (clamp main to enforce-full)
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          REF="${{ github.base_ref || github.ref_name }}"
          if [ "$REF" = "main" ]; then
            echo "Branch main: clamping mode '${MODE}' -> enforce-full"
            MODE="enforce-full"
          fi
          case "$MODE" in
            warn|enforce-critical|enforce-full) ;;
            *) echo "::error::invalid gate mode: ${MODE}"; exit 1 ;;
          esac
          echo "GATE_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Effective gate mode: $MODE (ref: $REF, input: '${{ inputs.mode }}')"

      - name: Download SARIF artifacts (all required, fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra NAMES <<< "${{ inputs.sarif-artifacts }}"
          mkdir -p sarif
          for name in "${NAMES[@]}"; do
            name="$(echo "$name" | xargs)"
            [ -n "$name" ] || continue
            case "$name" in
              *[!a-zA-Z0-9._-]*) echo "::error::invalid artifact name: $name"; exit 1 ;;
            esac
            echo "Downloading artifact: $name"
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "$name" \
              --dir "sarif/$name" \
              || { echo "::error::missing SARIF artifact: $name"; exit 1; }
            test -n "$(find "sarif/$name" -name '*.sarif' -print -quit)" \
              || { echo "::error::artifact '$name' contains no .sarif file"; exit 1; }
          done

      - name: Merge and validate SARIF (fail-closed)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys

          paths = sorted(glob.glob("sarif/*/*.sarif"))
          if not paths:
              sys.exit("no SARIF files found")

          merged = {"version": "2.1.0", "runs": []}
          for path in paths:
              try:
                  with open(path) as f:
                      doc = json.load(f)
              except Exception as exc:
                  sys.exit(f"invalid SARIF JSON in {path}: {exc}")
              runs = doc.get("runs")
              if not isinstance(runs, list) or not runs:
                  sys.exit(f"SARIF missing runs[]: {path}")
              merged["runs"].extend(runs)

          if not merged["runs"]:
              sys.exit("merged SARIF has no runs")

          for i, run in enumerate(merged["runs"]):
              driver = (run.get("tool") or {}).get("driver") or {}
              name = str(driver.get("name", ""))
              if not name.strip():
                  sys.exit(f"run {i}: missing tool.driver.name")
              if not isinstance(run.get("results"), list):
                  sys.exit(f"run {i} ({name}): missing results[]")
              results = run["results"]
              rules = driver.get("rules")
              if rules is not None and not isinstance(rules, list):
                  sys.exit(f"run {i} ({name}): tool.driver.rules is not a list")
              print(f"run {i}: tool={name}, rules="
                    f"{'absent' if rules is None else len(rules)}, results={len(results)}")

          with open("merged.sarif", "w") as f:
              json.dump(merged, f)
          print(f"merged SARIF OK: {len(merged['runs'])} runs -> merged.sarif")
          PY

      - name: Load findings baseline (fail-closed)
        run: |
          set -euo pipefail
          BASELINE="${{ inputs.baseline-file }}"
          if [ -z "$BASELINE" ]; then
            echo '{"fingerprints": []}' > baseline.json
            echo "baseline disabled by input; using empty baseline"
          else
            test -f "$BASELINE" \
              || { echo "::error::baseline file missing: $BASELINE"; exit 1; }
            cp "$BASELINE" baseline.json
          fi
          python3 -c '
          import json, sys
          try:
              doc = json.load(open("baseline.json"))
          except Exception as exc:
              sys.exit(f"invalid baseline JSON: {exc}")
          fps = doc.get("fingerprints")
          if not isinstance(fps, list):
              sys.exit("baseline missing fingerprints[]")
          bad = [e for e in fps if not isinstance(e, dict)
                 or not all(isinstance(e.get(k), str) and e[k]
                            for k in ("sha256", "tool", "ruleId", "path", "message"))]
          if bad:
              sys.exit(f"baseline has {len(bad)} malformed entries")
          print(f"baseline OK: {len(fps)} fingerprints")
          '

      - name: Install conftest (trusted SHA-256)
        run: |
          set -euo pipefail
          VER="${{ inputs.conftest-version }}"
          SHA="${{ inputs.conftest-sha256 }}"
          cd "$RUNNER_TEMP"
          curl -fsSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz"
          echo "${SHA}  conftest.tar.gz" | sha256sum -c --strict
          tar -xzf conftest.tar.gz conftest
          ./conftest --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: conftest verify (policy unit tests)
        run: |
          set -euo pipefail
          conftest verify --policy "${{ inputs.policy-path }}"

      - name: Build gate input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open("merged.sarif") as f:
              sarif = json.load(f)
          with open("baseline.json") as f:
              baseline = json.load(f)
          combined = {
              "mode": os.environ["GATE_MODE"],
              "sarif": sarif,
              "baseline": baseline,
          }
          out = os.path.join(os.environ["RUNNER_TEMP"], "gate_input.json")
          with open(out, "w") as f:
              json.dump(combined, f)
          print(f"gate input built: mode={combined['mode']}, "
                f"runs={len(sarif['runs'])}, "
                f"fingerprints={len(baseline['fingerprints'])}")
          PY

      - name: Evaluate policy
        run: |
          set -euo pipefail
          conftest test --parser json --output github \
            --policy "${{ inputs.policy-path }}" \
            "$RUNNER_TEMP/gate_input.json"
